[package]
name = "golfsim"
version = "0.1.0"
edition = "2021"
description = "Rust port of Sunshine Golf Classic's physics (Golf13K) and the RL environment, bit-exact with the JS game"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libm = "0.2"
rayon = "1.12.0"
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bin]]
name = "golfsim-cli"
path = "src/bin/golfsim.rs"
