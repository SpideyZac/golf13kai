[project]
name = "golfrl"
version = "0.1.0"
description = "PPO trainer (PyTorch, GPU) for the Sunshine Golf Classic agent, on the Rust env in ../golfsim"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["golfrl"]
